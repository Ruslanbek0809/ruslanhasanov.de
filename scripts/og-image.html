<!doctype html>
<!--
  Source for public/og.png (1200×630). Regenerate with:  npm run og
  Uses the self-hosted font from node_modules and the photo from src/assets.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
@font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2-variations'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #f9fafb;
  color: #0b0f13;
  font-family: 'Sora', sans-serif;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 72px 80px 64px;
}
.top { font: 600 24px 'Sora', sans-serif; color: #5c6a7e; letter-spacing: -.01em; }
.plate { display: flex; align-items: center; gap: 48px; }
.ph { width: 196px; height: 196px; border-radius: 24px; overflow: hidden; background: #f1f4f8; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; filter: grayscale(1) contrast(1.04); display: block; }
h1 { font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -.045em; margin: 0 0 20px; }
.role { font: 500 32px/1.35 'Sora', sans-serif; color: #334155; letter-spacing: -.015em; margin: 0; }
.bottom { display: flex; gap: 28px; align-items: baseline; font: 400 26px 'Sora', sans-serif; color: #5c6a7e; padding-top: 32px; border-top: 2px solid #e0e5eb; }
.status { color: #2563eb; font-weight: 600; }
.bottom b { color: #0b0f13; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">ruslanhasanov.de</div>
  <div class="plate">
    <div class="ph"><img src="../src/assets/profile.jpg" alt=""></div>
    <div>
      <h1>Ruslan Hasanov</h1>
      <p class="role">AI/ML engineer · time series · LLM agents</p>
    </div>
  </div>
  <div class="bottom"><span class="status">Available now</span><span><b>M.Sc. student</b> · TU Ilmenau · Bremerhaven</span></div>
</body>
</html>

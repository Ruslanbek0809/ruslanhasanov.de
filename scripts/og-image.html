<!doctype html>
<!--
  Source for public/og.png (1200×630). Regenerate with:  npm run og
  Uses the self-hosted fonts from node_modules and the photo from src/assets.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background-color: #f3f5f7;
  background-image: linear-gradient(rgba(14,22,33,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(14,22,33,.06) 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: -1px -1px;
  color: #0e1621;
  font-family: 'IBM Plex Sans', sans-serif;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 64px 72px;
  border-bottom: 14px solid #0b6e66;
}
.top { display: flex; justify-content: space-between; align-items: center; font: 500 22px 'IBM Plex Mono', monospace; color: #4f5b69; letter-spacing: .04em; }
.mark { display: grid; place-items: center; width: 64px; height: 64px; border: 2px solid #0e1621; color: #0e1621; font: 500 24px 'IBM Plex Mono', monospace; background: #fff; }
.plate { display: flex; align-items: center; gap: 44px; }
.ph { width: 200px; height: 200px; border: 1px solid #d5dbe2; background: #fff; padding: 5px; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; filter: grayscale(1) contrast(1.04); display: block; }
h1 { font-weight: 600; font-size: 92px; line-height: 1; letter-spacing: -.035em; margin: 0 0 22px; }
.role { font: 400 30px/1.4 'IBM Plex Mono', monospace; color: #4f5b69; margin: 0; }
.status { display: inline-flex; align-items: center; gap: 14px; font: 500 22px 'IBM Plex Mono', monospace; border: 1px solid #d5dbe2; background: #fff; padding: 10px 18px; }
.status::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #0b6e66; box-shadow: 0 0 0 5px #e2f1ef; }
.bottom { display: flex; justify-content: space-between; align-items: center; font: 400 24px 'IBM Plex Mono', monospace; color: #4f5b69; }
.bottom b { color: #0b6e66; font-weight: 500; }
</style>
</head>
<body>
  <div class="top"><span class="mark">RH</span><span>ruslanhasanov.de</span></div>
  <div class="plate">
    <div class="ph"><img src="../src/assets/profile.jpg" alt=""></div>
    <div>
      <h1>Ruslan Hasanov</h1>
      <p class="role">AI/ML engineer · time series · LLM agents</p>
    </div>
  </div>
  <div class="bottom"><span class="status">Available now</span><span><b>M.Sc. student</b> · TU Ilmenau · Bremerhaven</span></div>
</body>
</html>
